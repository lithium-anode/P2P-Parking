<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}">
    <title>Register - P2P Parking</title>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 shadow-sm rounded">
                <h3 class="text-center mb-4">Create an Account</h3>
                <form th:action="@{/register}" th:object="${registrationForm}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" th:field="*{username}" class="form-control" 
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" th:field="*{email}" class="form-control" 
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" th:field="*{password}" class="form-control" 
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">I am a:</label>
                        <select th:field="*{role}" class="form-select" 
                                th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                            <option value="">Select Role...</option>
                            <option th:each="roleOpt : ${roles}" 
                                    th:value="${roleOpt}" th:text="${roleOpt}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                    </div>

                    <div class="mb-3" id="vehicleTypeSection" style="display: none;">
                        <label class="form-label">Vehicle Types (Select all that apply)</label>
                        <div class="row">
                            <div th:each="vType : ${T(parking.project.model.enums.VehicleType).values()}" class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" th:field="*{vehicleTypes}" th:value="${vType}">
                                    <label class="form-check-label" th:text="${vType}"></label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                
                <p class="text-center mt-3">Already have an account? <a th:href="@{/login}">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        // Show/Hide vehicle types based on role selection
        document.getElementById('role').addEventListener('change', function() {
            const section = document.getElementById('vehicleTypeSection');
            section.style.display = (this.value === 'DRIVER') ? 'block' : 'none';
        });
    </script>
</body>
</html>
