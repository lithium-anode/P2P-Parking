<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - P2P Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; }
        .status-badge { width: 100px; display: inline-block; }
    </style>
</head>
<body class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-danger">Admin Control Center</h1>
        <a href="/admin/reports" class="btn btn-outline-secondary">System Reports</a>
    </div>

    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show">
        User status updated successfully!
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">System Users</h5>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.username}">jdoe</td>
                        <td th:text="${user.email}">jdoe@example.com</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${user.role}">DRIVER</span>
                        </td>
                        <td>
                            <span th:classappend="${user.status.name() == 'ACTIVE' ? 'bg-success' : (user.status.name() == 'UNVERIFIED' ? 'bg-warning' : 'bg-danger')}" 
                                  class="badge status-badge" th:text="${user.status}">ACTIVE</span>
                        </td>
                        <td class="text-center">
                            <form th:if="${user.status.name() == 'UNVERIFIED'}" 
                                  th:action="@{'/admin/user/verify/' + ${user.id}}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-success">Verify</button>
                            </form>

                            <form th:if="${user.status.name() == 'ACTIVE'}" 
                                  th:action="@{'/admin/user/suspend/' + ${user.id}}" method="post" class="d-inline">
                                <input type="hidden" name="suspend" value="true">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Suspend</button>
                            </form>
                            
                            <form th:if="${user.status.name() == 'SUSPENDED'}" 
                                  th:action="@{'/admin/user/suspend/' + ${user.id}}" method="post" class="d-inline">
                                <input type="hidden" name="suspend" value="false">
                                <button type="submit" class="btn btn-sm btn-outline-primary">Activate</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
