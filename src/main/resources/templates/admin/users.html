<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - P2P Parking Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">P2P Parking - Admin Panel</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                <a class="nav-link active" th:href="@{/admin/users}">Users</a>
                <a class="nav-link" th:href="@{/admin/reports}">Reports</a>
                <a class="nav-link" th:href="@{/admin/monitor}">Monitor</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <h1>User Management</h1>
                <p>Manage all user accounts in the system</p>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>All Users</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Username</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.id}">1</td>
                                        <td th:text="${user.username}">username</td>
                                        <td th:text="${user.email}">email@example.com</td>
                                        <td th:text="${user.role}">ROLE</td>
                                        <td>
                                            <span th:class="${user.status.name() == 'ACTIVE' ? 'badge bg-success' :
                                                           user.status.name() == 'SUSPENDED' ? 'badge bg-warning' :
                                                           user.status.name() == 'UNVERIFIED' ? 'badge bg-secondary' :
                                                           'badge bg-danger'}"
                                                  th:text="${user.status}">STATUS</span>
                                        </td>
                                        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01</td>
                                        <td>
                                            <div class="btn-group" role="group">
                                                <form th:if="${user.status.name() == 'UNVERIFIED'}" th:action="@{/admin/users/{id}/verify(id=${user.id})}" method="post" style="display: inline;">
                                                    <button type="submit" class="btn btn-sm btn-success">Verify</button>
                                                </form>

                                                <form th:if="${user.status.name() == 'ACTIVE'}" th:action="@{/admin/users/{id}/suspend(id=${user.id})}" method="post" style="display: inline;">
                                                    <input type="hidden" name="suspend" value="true">
                                                    <button type="submit" class="btn btn-sm btn-warning">Suspend</button>
                                                </form>

                                                <form th:if="${user.status.name() == 'SUSPENDED'}" th:action="@{/admin/users/{id}/suspend(id=${user.id})}" method="post" style="display: inline;">
                                                    <input type="hidden" name="suspend" value="false">
                                                    <button type="submit" class="btn btn-sm btn-info">Unsuspend</button>
                                                </form>

                                                <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display: inline;"
                                                      onsubmit="return confirm('Are you sure you want to delete this user?');">
                                                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
