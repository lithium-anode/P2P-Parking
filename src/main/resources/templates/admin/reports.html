<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Reports - P2P Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body class="container py-5">
    <nav class="mb-4">
        <a href="/admin/dashboard" class="text-decoration-none text-primary">← Back to User Management</a>
    </nav>

    <h1 class="mb-4 text-primary">System Usage Reports</h1>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-4 shadow-sm glass-card text-center">
                <h6 class="text-muted text-uppercase">Total Platform Revenue</h6>
                <h2 class="text-primary">$12,450.00</h2>
                <small class="text-success">↑ 12% from last month</small>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 shadow-sm glass-card text-center">
                <h6 class="text-muted text-uppercase">Spot Occupancy Rate</h6>
                <h2 class="text-primary">78%</h2>
                <small class="text-muted">Based on 150 listed spots</small>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 shadow-sm glass-card text-center">
                <h6 class="text-muted text-uppercase">Total Active Users</h6>
                <h2 class="text-primary">432</h2>
                <small class="text-success">↑ 45 new registrations</small>
            </div>
        </div>
    </div>

    <div class="card mt-5 p-4 shadow-sm glass-card">
        <h5>Usage Trends (Last 7 Days)</h5>
        <div style="height: 200px;" class="d-flex align-items-center justify-content-center border rounded glass-border">
            <p class="text-muted">Transaction Chart Visualization Placeholder for Demo</p>
        </div>
    </div>
</body>
</html>
