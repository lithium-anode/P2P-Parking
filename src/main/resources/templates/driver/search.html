<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Parking - P2P Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
</head>
<body class="container py-5">
    <nav class="mb-4">
        <a href="/driver/dashboard" class="text-decoration-none text-primary">← Back to Dashboard</a>
    </nav>

    <h1 class="mb-4 text-primary">Find a Parking Spot</h1>

    <form action="/driver/search" method="get" class="row g-3 mb-5">
        <div class="col-md-9">
            <input type="text" name="location" class="form-control form-control-lg" 
                   placeholder="Enter city or street name..." required>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn cyber-btn btn-lg w-100">Search</button>
        </div>
    </form>

    <div th:if="${spots != null}">
        <h3 class="mb-3">Available Spots</h3>
        <div class="row">
            <div th:each="spot : ${spots}" class="col-md-6 mb-3">
                <div class="card h-100 glass-card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${spot.location}">Location</h5>
                        <p class="card-text text-muted" th:text="${spot.spotType}">STANDARD</p>
                        <h4 class="text-success">$<span th:text="${spot.pricePerHour}">10</span>/hr</h4>
                        
                        <form action="/driver/reserve" method="post">
                            <input type="hidden" name="spotId" th:value="${spot.id}">
                            <input type="hidden" name="driverId" value="1">
                            <button type="submit" class="btn cyber-btn mt-2">Reserve Now</button>
                        </form>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(spots)}" class="col-12 text-center py-5">
                <p class="lead text-muted">No spots found in that location. Try another search.</p>
            </div>
        </div>
    </div>
</body>
</html>
