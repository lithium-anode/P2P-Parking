<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}"><title>Find Parking</title></head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>
    <div class="container">
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
            <div th:switch="${param.error[0]}">
                <span th:case="'Spot is not available for booking'">
                    <i class="bi bi-exclamation-octagon-fill me-2"></i>
                    <strong>Booking Failed:</strong> This spot was just taken. Please choose a different location.
                </span>

                <span th:case="'Incompatible vehicle type'">
                    <i class="bi bi-ev-front-fill me-2"></i>
                    <strong>Vehicle Mismatch:</strong> Your vehicle does not support the requirements for this spot.
                </span>

                <span th:case="*">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <span th:text="${param.error}">General Error</span>
                </span>
            </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Available Parking Spots</h2>
            <a th:href="@{/driver/history}" class="btn btn-outline-primary">View My Bookings</a>
        </div>
        <form th:action="@{/driver/search}" method="get" class="row g-3 mb-4">
            <div class="col-md-6">
                <input type="text" name="location" class="form-control" placeholder="Search by location (e.g., Downtown)">
            </div>
            <div class="col-md-4">
                <select name="type" class="form-select">
                    <option value="">All Spot Types</option>
                    <option th:each="type : ${T(parking.project.model.enums.SpotType).values()}" 
                            th:value="${type}" th:text="${type}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
        </form>

        <div class="row">
            <div th:each="spot : ${spots}" class="col-md-4 mb-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${spot.location}">Location</h5>
                        <p class="card-text">
                            <strong>Rate:</strong> <span th:text="${#numbers.formatCurrency(spot.hourlyRate)}"></span>/hr<br>
                            <strong>Type:</strong> <span th:text="${spot.spotType}">STANDARD</span>
                        </p>
                        <form th:action="@{/driver/book}" method="post">
                            <input type="hidden" name="spotId" th:value="${spot.id}">
                            <div class="input-group mb-2">
                                <span class="input-group-text">Hours</span>
                                <input type="number" name="duration" class="form-control" value="1" min="1" max="24">
                            </div>
                            <button type="submit" class="btn btn-success btn-sm w-100">Book Now</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
