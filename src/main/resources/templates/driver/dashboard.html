<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Driver Dashboard - P2P Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Driver Dashboard</h1>
        <a href="/driver/search" class="btn btn-success">Find Parking</a>
    </div>

    <div th:if="${param.success}" class="alert alert-success">
        Operation successful!
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card p-4">
                <h3>Profile</h3>
                <hr>
                <p><strong>Username:</strong> <span th:text="${driver.username}">User</span></p>
                <p><strong>Email:</strong> <span th:text="${driver.email}">email@example.com</span></p>
                <p><strong>Vehicle:</strong> <span th:text="${driver.vehicleModel}">Model</span> (<span th:text="${driver.vehicleNumber}">ABC-123</span>)</p>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-4">
                <h3>Current Bookings</h3>
                <hr>
                <p class="text-muted">You have no active bookings at the moment.</p>
                </div>
        </div>
    </div>
</body>
</html>
