<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}"><title>My Listings</title></head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Parking Spots</h2>
            <button class="btn btn-primary" onclick="editSpot(null, '', '', '')">Add New Spot</button>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-primary text-white">
                    <div class="card-body">
                        <h6 class="card-title text-uppercase mb-2" style="font-size: 0.8rem; opacity: 0.8;">Total Earnings</h6>
                        <h2 class="mb-0" th:text="${#numbers.formatCurrency(totalEarnings)}">£0.00</h2>
                    </div>
                </div>
            </div>
        </div>

        <table class="table bg-white shadow-sm rounded">
            <thead>
                <tr>
                    <th>Location</th>
                    <th>Hourly Rate</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${mySpots}">
                    <td th:text="${s.location}"></td>
                    <td th:text="${#numbers.formatCurrency(s.hourlyRate)}"></td>
                    <td th:text="${s.spotType}"></td>
                    <td><span class="badge bg-info" th:text="${s.status}">AVAILABLE</span></td>
                    <td class="d-flex">
                        <button class="btn btn-warning btn-sm me-2"
                                th:data-id="${s.id}"
                                th:data-location="${s.location}"
                                th:data-rate="${s.hourlyRate}"
                                th:data-type="${s.spotType}"
                                onclick="editSpot(this.getAttribute('data-id'), 
                                                this.getAttribute('data-location'), 
                                                this.getAttribute('data-rate'), 
                                                this.getAttribute('data-type'))">
                            Edit
                        </button>

                        <form th:action="@{/owner/spots/delete/{id}(id=${s.id})}" method="post" 
                            onsubmit="return confirm('Are you sure you want to delete this listing?');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="addSpotModal" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{/owner/spots/save}" method="post" class="modal-content">
                <input type="hidden" name="id" id="spotId">
                <input type="hidden" name="mode" id="mode" value="add">
                <div class="modal-header">
                    <h5 id="modalTitle">List a New Parking Space</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Location</label>
                        <input type="text" name="location" id="location" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Hourly Rate (£)</label>
                        <input type="number" step="0.01" name="hourlyRate" id="hourlyRate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Spot Type</label>
                        <select name="spotType" id="spotType" class="form-select">
                            <option th:each="type : ${T(parking.project.model.enums.SpotType).values()}" 
                                    th:value="${type}" th:text="${type}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function editSpot(id, location, hourlyRate, spotType) {
        document.getElementById('spotId').value = id;
        document.getElementById('location').value = location;
        document.getElementById('hourlyRate').value = hourlyRate;
        document.getElementById('spotType').value = spotType;
        document.getElementById('mode').value = 'edit';
        document.getElementById('modalTitle').textContent = 'Edit Parking Space';
        new bootstrap.Modal(document.getElementById('addSpotModal')).show();
    }
    </script>
</body>
</html>
