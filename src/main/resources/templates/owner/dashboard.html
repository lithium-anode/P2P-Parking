<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Owner Dashboard - P2P Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; } /* Requirement: White background */
        .earnings-box { border-left: 5px solid #198754; background: #f8f9fa; }
    </style>
</head>
<body class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-success">Owner Dashboard</h1>
        <a href="/owner/add-spot" class="btn btn-primary">+ List New Spot</a>
    </div>

    <div class="card earnings-box p-4 mb-5">
        <h4 class="text-muted">Total Earnings</h4>
        <h2 class="display-4 text-success">$<span th:text="${totalEarnings}">0.00</span></h2>
    </div>

    <h3 class="mb-3">My Parking Spots</h3>
    <div class="table-responsive card p-3 shadow-sm">
        <table class="table table-hover">
            <thead class="table-light">
                <tr>
                    <th>Location</th>
                    <th>Type</th>
                    <th>Price/Hr</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="spot : ${spots}">
                    <td th:text="${spot.location}">Street Address</td>
                    <td th:text="${spot.spotType}">Standard</td>
                    <td th:text="'$' + ${spot.pricePerHour}">$10.00</td>
                    <td>
                        <span th:if="${spot.isAvailable}" class="badge bg-success">Available</span>
                        <span th:if="${!spot.isAvailable}" class="badge bg-danger">Occupied</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(spots)}">
                    <td colspan="4" class="text-center py-4 text-muted">You haven't listed any spots yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
