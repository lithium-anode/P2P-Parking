<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Parking Spot - P2P Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="#">P2P Parking - Owner Panel</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/owner/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/owner/spots}">My Spots</a>
                <a class="nav-link" th:href="@{/owner/earnings}">Earnings</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h1>Edit Parking Spot</h1>
                <p>Update your parking spot information</p>

                <div class="card mt-3">
                    <div class="card-body">
                        <form method="post" th:action="@{/owner/spots/{id}/update(id=${spot.id})}">
                            <div class="mb-3">
                                <label for="location" class="form-label">Location Name</label>
                                <input type="text" class="form-control" id="location" name="location" 
                                       th:value="${spot.location}" required>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Street Address</label>
                                <input type="text" class="form-control" id="address" name="address" 
                                       th:value="${spot.address}" required>
                            </div>

                            <div class="mb-3">
                                <label for="hourlyRate" class="form-label">Hourly Rate ($)</label>
                                <input type="number" class="form-control" id="hourlyRate" name="hourlyRate" 
                                       th:value="${#numbers.formatDecimal(spot.hourlyRate, 1, 2)}" 
                                       step="0.01" min="0" required>
                            </div>

                            <div class="alert alert-info">
                                <strong>Note:</strong> Spot ID is <span th:text="${spot.id}">1</span> and cannot be changed.
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/owner/spots" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Update Spot</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
