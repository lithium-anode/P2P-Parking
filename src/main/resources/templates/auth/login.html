<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - P2P Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; } /* Requirement: White background */
        .login-container { max-width: 400px; margin-top: 100px; }
    </style>
</head>
<body class="container">
    <div class="login-container mx-auto card p-4 shadow-sm">
        <h2 class="text-center mb-4">Login</h2>
        
        <div th:if="${param.success}" class="alert alert-success">Registration successful! Please login.</div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3">Don't have an account? <a href="/register">Register here</a></p>
    </div>
</body>
</html>
