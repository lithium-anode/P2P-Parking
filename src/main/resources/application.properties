# --- SHARED APP CONFIG ---
spring.application.name=p2p-parking-finder

# --- DATABASE CONFIGURATION ---
spring.datasource.url=jdbc:mysql://localhost:3306/parkingdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# spring.datasource.password=${DB_PASSWORD:default_pwd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE CONFIGURATION ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- VIEW LAYER (MVC) CONFIGURATION ---
spring.thymeleaf.cache=false
# spring.thymeleaf.prefix=classpath:/templates/
# spring.thymeleaf.suffix=.html

# --- SERVER CONFIGURATION ---
server.port=8080
spring.web.error.include-message=always

# --- LOGGING ---
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# --- ACTIVE PROFILE ---
# This tells Spring to look for 'application-local.properties'
spring.profiles.active=local